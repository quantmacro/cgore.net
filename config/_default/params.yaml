# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: calibration
  theme_night: calibration
  font: calibration
  font_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'National Institute of Standards and Technology'
    description: 'Christina Gore is a research economist at NIST studying community resilience, electric vehicle adoption, and consumer preferences using choice experiments and survey design.'
    twitter: 'ChristinaGore13'
  analytics:
    # Universal Analytics stopped processing data in July 2023, so the old
    # UA-207282638-1 property collected nothing. Put a GA4 id (G-...) here to
    # resume measurement, or leave blank to load no analytics script at all.
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: 'GTM-TWR9JLF'
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {year} Christina Gore'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: ''
    content_dir: content
    branch: master
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: ''
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: master
    local_backend: false
  academicons:
    enable: true

# Security

security:
  # Allow frame for embedding speaker notes in slides
  allow_frame: true

# Contact details used for SEO and structured data.
# The Contact section's own details live in content/home/contact.md.

email: christina.gore@nist.gov
address:
  street: 100 Bureau Drive
  city: Gaithersburg
  region: MD
  postcode: '20899'
  country: United States
  country_code: US

# Content display options still read at site level in v5.9

abstract_length: 135
reading_time: true
show_related:
  book: true
  page: false
  post: true
  project: true
  publication: true
  event: true
publications:
  date_format: January 2006
  citation_style: apa
projects:
  post_view: 2
  publication_view: 2
  talk_view: 2
plugins_js: []
