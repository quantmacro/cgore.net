[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.119.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# /cv is a permanent address for the current CV; update `to` when the file
# changes. It lives here because the Wowchemy Netlify plugin generates
# _redirects from page aliases and overwrites anything static/ puts there.
[[redirects]]
  from = "/cv"
  to = "/media/Gore_CV_Sep26.pdf"
  status = 302

[[redirects]]
  from = "/cv/"
  to = "/media/Gore_CV_Sep26.pdf"
  status = 302

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
